<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Love</title>
  <style>
    :root {
      --primary-color: #e63946;
      --secondary-color: #ffb703;
      --bg-overlay: rgba(15, 10, 18, 0.85);
      --card-bg: rgba(255, 255, 255, 0.08);
      --text-color: #f1faee; 
    }

    /* Floating Emoji Animation Styles */
    .floating-emoji {
      position: fixed;
      font-size: 2rem;
      pointer-events: none;
      animation: floatUp 3s ease-out forwards;
      z-index: 9999;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(0.5);
        opacity: 1;
      }
      100% {
        transform: translateY(-150px) scale(1.4);
        opacity: 0;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      color: var(--text-color);
      /* REPLACE BACKGROUND PHOTO URL BELOW */
      background: linear-gradient(var(--bg-overlay), var(--bg-overlay)), 
                  url('BG_IMAGE_URL_HERE') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      max-width: 800px;
      width: 100%;
      text-align: center;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      color: #ff758c;
      text-shadow: 0 0 10px rgba(255, 117, 140, 0.5);
    }

    p.subtitle {
      font-size: 1.2rem;
      font-style: italic;
      margin-bottom: 30px;
      opacity: 0.9;
    }

    /* Photo Gallery Windows */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin: 30px 0;
    }

    .photo-window {
      height: 220px;
      border-radius: 15px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      transition: transform 0.3s ease, border-color 0.3s ease;
      position: relative;
    }

    .photo-window:hover {
      transform: scale(1.03);
      border-color: var(--primary-color);
    }

    .photo-window img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    /* Question Box Section */
    .question-box {
      margin: 25px 0;
      background: rgba(0, 0, 0, 0.25);
      padding: 25px;
      border-radius: 15px;
      border: 1px solid rgba(255, 117, 140, 0.3);
    }

    .question-box h2 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: #ff758c;
    }

    .choice-group {
      display: flex;
      gap: 20px;
      justify-content: center;
    }

    .btn-yes {
      background: linear-gradient(135deg, #2a9d8f 0%, #2ec4b6 100%);
      color: white;
      border: none;
      padding: 12px 35px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(46, 196, 182, 0.4);
    }

    .btn-yes:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(46, 196, 182, 0.6);
    }

    .btn-no {
      background: linear-gradient(135deg, #e63946 0%, #d62828 100%);
      color: white;
      border: none;
      padding: 12px 35px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(230, 57, 70, 0.4);
    }

    .btn-no:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(230, 57, 70, 0.6);
    }

    /* Interactive Buttons */
    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      margin-top: 20px;
    }

    .btn {
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4);
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(255, 117, 140, 0.6);
    }

    /* Pop-up Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 1000;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: #1a1a2e;
      padding: 30px;
      border-radius: 15px;
      max-width: 450px;
      width: 90%;
      text-align: center;
      border: 1px solid #ff758c;
      box-shadow: 0 0 20px rgba(255, 117, 140, 0.4);
      transform: translateY(20px);
      transition: transform 0.3s ease;
    }

    .modal-overlay.active .modal-box {
      transform: translateY(0);
    }

    .modal-box p {
      font-size: 1.2rem;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .close-btn {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>
<!-- Background Audio -->
<audio id="bg-music" loop>
  <source src="music1.mp3" type="audio/mpeg">
</audio>

<!-- Audio Control Button -->
<button id="music-btn" onclick="toggleMusic()" style="position: fixed; top: 20px; right: 20px; background: rgba(255, 117, 140, 0.8); color: white; border: none; padding: 10px 15px; border-radius: 50px; cursor: pointer; font-weight: bold; z-index: 1000; box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4);">
  🎵 Play Music
</button>

  <div class="container">
    <h1>Thinking of You makes me hard...</h1>
    <p class="subtitle">A little space created just for us, Hon.</p>

    <!-- Photo Windows Section -->
    <div class="photo-grid">
      <div class="photo-window">
        <!-- REPLACE WITH YOUR PHOTO 1 -->
        <img src="favorite memory 1.jpg" alt="Favorite memory 1">
      </div>
      <div class="photo-window">
        <!-- REPLACE WITH YOUR PHOTO 2 -->
        <img src="favorite memory 2.jpg" style="object-position: center 20%;" alt="Favorite memory 2">
      </div>
      <div class="photo-window">
        <!-- REPLACE WITH YOUR PHOTO 3 -->
        <img src="favorite memory 3.jpg" style="object-position: center 10%;" alt="Favorite memory 3">
      </div>
    </div>

    <!-- Yes / No Choice Section -->
    <div class="question-box">
      <h2>Will you let me in tonight?</h2>
      <div class="choice-group">
        <button class="btn-yes" onclick="answerQuestion(true, event)">Yes</button>
        <button class="btn-no" onclick="answerQuestion(false, event)">No</button>
      </div>
    </div>

    <!-- Interactive Buttons -->
    <div class="button-group">
      <button class="btn" onclick="showPopup('I can\'t stop thinking about your touch and how amazing it feels to be close to and inside of you.', event)">A Secret Thought</button>
      <button class="btn" onclick="showPopup('Tonight is all about us. Name the time, and I\'ll take care of your soft, warm and tasty body...', event)">Tonight's Plan</button>
      <button class="btn" onclick="showPopup('Count down until we get to leave the rest of the world behind and focus only on each other\'s needs.', event)">A Private Invitation</button>
    </div>
  </div>

  <!-- Pop-up Modal Structure -->
  <div class="modal-overlay" id="modal">
    <div class="modal-box">
      <p id="modal-text">Popup message goes here...</p>
      <button class="close-btn" onclick="hidePopup()">Close</button>
    </div>
  </div>

  <script>
    function showPopup(message) {
      document.getElementById('modal-text').innerText = message;
      document.getElementById('modal').classList.add('active');
    }

    function hidePopup() {
      document.getElementById('modal').classList.remove('active');
    }
  </script>
  <script>
  // Dynamic Emoji Lists
  const positiveEmojis = ['💖', '🔥', '💋', '❤️', '🌹', '✨', '🥵'];
  const negativeEmojis = ['🥺', '😭', '💔', '😿', '🌧️', '😢'];

  // Function to create a floating emoji with optional specific list override
  function spawnEmoji(x, y, customList) {
    const listToUse = customList || positiveEmojis;
    const emoji = document.createElement('div');
    emoji.className = 'floating-emoji';
    emoji.innerText = listToUse[Math.floor(Math.random() * listToUse.length)];
    
    if (x && y) {
      emoji.style.left = (x + (Math.random() * 60 - 30)) + 'px';
      emoji.style.top = (y + (Math.random() * 60 - 30)) + 'px';
    } else {
      emoji.style.left = Math.random() * window.innerWidth + 'px';
      emoji.style.top = (window.innerHeight - 100) + 'px';
    }

    document.body.appendChild(emoji);

    setTimeout(() => {
      emoji.remove();
    }, 2000);
  }

  // Handle Yes/No answer clicks
  function answerQuestion(isYes, event) {
    const rect = event.target.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    if (isYes) {
      showPopup("I knew you couldn't resist... Get ready, because I'm going to make you feel incredible tonight. 🔥❤️");
      for (let i = 0; i < 12; i++) {
        spawnEmoji(centerX, centerY, positiveEmojis);
      }
    } else {
      showPopup("Are you sure? You know you won't be able to stay away from me for long... 😉💔");
      for (let i = 0; i < 12; i++) {
        spawnEmoji(centerX, centerY, negativeEmojis);
      }
    }
  }

  // Trigger floating emojis automatically when the page loads
  window.addEventListener('load', () => {
    for (let i = 0; i < 15; i++) {
      setTimeout(() => {
        spawnEmoji();
      }, i * 150);
    }

    // Attempt to auto-play background music
    const music = document.getElementById('bg-music');
    music.volume = 0.5;
    music.play().then(() => {
      document.getElementById('music-btn').innerText = '🔊 Pause Music';
    }).catch(error => {
      console.log("Autoplay blocked by browser. User interaction needed.");
      document.getElementById('music-btn').innerText = '🎵 Play Music';
    });
  });

  // Toggle background music on/off
  function toggleMusic() {
    const music = document.getElementById('bg-music');
    const btn = document.getElementById('music-btn');
    
    if (music.paused) {
      music.play();
      btn.innerText = '🔊 Pause Music';
    } else {
      music.pause();
      btn.innerText = '🎵 Play Music';
    }
  }

  // Update existing showPopup function to also trigger a positive emoji burst on button click
  const originalShowPopup = showPopup;
  showPopup = function(message, event) {
    originalShowPopup(message);
    
    if (event) {
      const rect = event.target.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      
      for (let i = 0; i < 8; i++) {
        spawnEmoji(centerX, centerY, positiveEmojis);
      }
    }
  };
</script>
</body>
</html>
